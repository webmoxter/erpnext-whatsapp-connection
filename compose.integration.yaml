name: erpnext-whatsapp-connection-integration
services:
  db:
    image: mariadb:11.8@sha256:d9f7eb2637296652f24b484afd5d246f759f49f5babcadc6a9e344c9acb75fbf
    environment:
      MYSQL_ROOT_PASSWORD: integration-root-password
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - integration-db:/var/lib/mysql
  redis-cache:
    image: redis:8.6-alpine@sha256:cd218f4b106a332c5c992e38a9480bfb9d7e9f8f7b0ec9a0023bfa36d9a408f9
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis-queue:
    image: redis:8.6-alpine@sha256:cd218f4b106a332c5c992e38a9480bfb9d7e9f8f7b0ec9a0023bfa36d9a408f9
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  configurator:
    image: ${ADDON_IMAGE:?set ADDON_IMAGE}
    entrypoint: ["bash", "-euo", "pipefail", "-c"]
    command:
      - >-
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host db;
        bench set-config -gp db_port 3306;
        bench set-config -g redis_cache redis://redis-cache:6379;
        bench set-config -g redis_queue redis://redis-queue:6379;
        bench set-config -g redis_socketio redis://redis-queue:6379;
        bench set-config -gp socketio_port 9000
    depends_on:
      db: {condition: service_healthy}
      redis-cache: {condition: service_healthy}
      redis-queue: {condition: service_healthy}
    volumes:
      - integration-sites:/home/frappe/frappe-bench/sites
  site-init:
    image: ${ADDON_IMAGE:?set ADDON_IMAGE}
    entrypoint: ["bash", "-euo", "pipefail", "-c"]
    command:
      - >-
        test ! -d sites/integration.local;
        bench new-site integration.local
        --db-root-password integration-root-password
        --admin-password integration-admin-password
        --mariadb-user-host-login-scope=%;
        bench --site integration.local install-app erpnext;
        bench --site integration.local install-app erpnext_whatsapp_connection;
        bench --site integration.local migrate;
        bench --site integration.local migrate
    depends_on:
      configurator: {condition: service_completed_successfully}
    volumes:
      - integration-sites:/home/frappe/frappe-bench/sites
  acceptance:
    image: ${ADDON_IMAGE:?set ADDON_IMAGE}
    entrypoint: ["bash", "-euo", "pipefail", "-c"]
    command:
      - >-
        bench --site integration.local list-apps | grep -q erpnext;
        bench --site integration.local list-apps | grep -q erpnext_whatsapp_connection;
        bench --site integration.local execute erpnext_whatsapp_connection.acceptance.validate_installation
    depends_on:
      site-init: {condition: service_completed_successfully}
    volumes:
      - integration-sites:/home/frappe/frappe-bench/sites
volumes:
  integration-db: {}
  integration-sites: {}
